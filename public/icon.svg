<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Orange rounded background -->
  <rect width="512" height="512" rx="112" fill="#f97316"/>
  <!-- Basketball circle -->
  <circle cx="256" cy="256" r="168" fill="#ea580c"/>
  <!-- Basketball seam lines - bold and high contrast -->
  <!-- Horizontal line -->
  <line x1="88" y1="256" x2="424" y2="256" stroke="#c2410c" stroke-width="18" stroke-linecap="round"/>
  <!-- Vertical line -->
  <line x1="256" y1="88" x2="256" y2="424" stroke="#c2410c" stroke-width="18" stroke-linecap="round"/>
  <!-- Left curve -->
  <path d="M160 96 Q100 256 160 416" stroke="#c2410c" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Right curve -->
  <path d="M352 96 Q412 256 352 416" stroke="#c2410c" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Highlight for depth -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#fb923c" stroke-width="6" opacity="0.4"/>
</svg>
